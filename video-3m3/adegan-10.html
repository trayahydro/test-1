<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Adegan 10: Air produk & konsentrat</title>
<link rel="stylesheet" href="../video/lib/overlay.css">
</head>
<body><div id="stage"></div>
<script>window.TIMING_DIR = 'tts/'; window.TAHAP = ['Intake', 'Sand Filter', 'Karbon Aktif', 'Cartridge', 'Dosing', 'HPP', 'Membran RO', 'Produk']; window.ready = new Promise((r) => (window._ready = r));</script>
<script type="importmap">{ "imports": { "three": "../video/node_modules/three/build/three.module.js", "three/addons/": "../video/node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { kamera } from '../video/lib/dunia.js';
import { siapkanAdegan, chip, bug, kartu, penanda, el, perbarui, waktu } from '../video/lib/overlay.js';
import { prog, easeInOut, clamp, lerp } from '../video/lib/common.js';
import { WARNA } from '../video/lib/aliran.js';
import { panggungRuangMesin } from './lib/panggung3m3.js';
import { V, penunjuk, alir, jalan } from './lib/bantu.js';

const A = await siapkanAdegan(10);
const D = A.durasi;
const P = await panggungRuangMesin({ tertutup: false });
const { cam, scene, refs, conn } = P;
const S = penunjuk(cam), Pp = refs.pipes, pt = refs.parts, an = refs.anchors;
const fHP = alir(Pp.hp, WARNA.hp, { parent: scene });
const fProd = alir(Pp.product, WARNA.produk, { parent: scene }), fProd2 = alir(conn.product, WARNA.produk, { parent: scene });
const fConc = alir(Pp.conc, WARNA.brine, { parent: scene, scale: 2.6 }), fDrain = alir(Pp.drain, WARNA.brine, { parent: scene }), fDrain2 = alir(conn.drain, WARNA.brine, { parent: scene });
const fFlush = alir(Pp.flush, WARNA.pre, { parent: scene, scale: 2.6 });
const camAt = kamera(cam, [
  { t: 0, p: [3.0, 1.75, 1.6], l: [2.1, 1.35, 0.2], f: 40 },
  { t: 3.2, p: [2.75, 1.6, 1.15], l: [2.15, 1.42, 0.3], f: 40 },
  { t: 5.6, p: [1.7, 1.45, 1.25], l: [1.15, 1.25, 0.37], f: 40 },
  { t: 6.8, p: [3.6, 2.1, 2.0], l: [2.4, 2.0, 0.0], f: 42 },
  { t: 11.8, p: [3.8, 2.2, 2.3], l: [2.5, 2.2, -0.2], f: 42 },
  { t: 12.6, p: [2.85, 1.12, 0.92], l: [2.08, 0.92, 0.28], f: 40 },
  { t: 18.8, p: [2.85, 0.92, 0.95], l: [2.1, 0.7, 0.3], f: 40 },
  { t: 21.2, p: [2.9, 0.6, 1.4], l: [2.4, 0.2, 0.3], f: 40 },
  { t: 21.8, p: [2.62, 1.12, 0.72], l: [2.12, 0.95, 0.08], f: 40 },
  { t: D, p: [2.7, 1.2, 0.85], l: [2.1, 0.97, 0.08], f: 40 },
]);
const flash = el('', 'shade'); flash.style.background = '#06152c';
chip('9', 'Air Produk & Konsentrat', 'Pemantauan dan pengaturan', 7, 0.3);
bug(0.2);
kartu({ k: 'CONDUCTIVITY METER', tt: 'Kadar Garam Dipantau', rows: [['Mengukur', 'terus-menerus'], ['Satuan', 'µS/cm → TDS']], x: 1360, y: 200, t0: 0.9, t1: 5.8, anchor: S(an.conductivity) });
penanda('•', 'Flowmeter produk', S(V(0.97, 1.2, 0.4)), 5.7, 6.9);
kartu({ k: 'AIR PRODUK', tt: 'TDS < 300 mg/L', rows: [['Status', 'tipikal'], ['Tujuan', 'tangki air tawar kapal']], x: 1360, y: 200, t0: 7.0, t1: 12.2 });
penanda('•', 'Ke tangki air tawar', S(V(3.2, 2.75, -0.65)), 8.2, 12.2, { kiri: true });
kartu({ k: 'KONSENTRAT', tt: 'Air Garam Pekat', rows: [['Pressure gauge', 'tekanan konsentrat'], ['Needle valve', 'atur tekanan kerja'], ['Flowmeter', 'laju konsentrat']], x: 1360, y: 200, t0: 12.4, t1: 21.4 });
penanda('•', 'Pressure gauge', S(an.pgConc), 12.9, 21.4, { kiri: true });
penanda('•', 'Needle valve', S(an.needle), 15.4, 21.4, { kiri: true });
penanda('•', 'Flowmeter', S(V(2.12, 0.65, 0.33)), 17.6, 21.4);
penanda('•', 'Saluran pembuangan', S(V(2.75, 0.1, 0.3)), 19.2, 21.4);
kartu({ k: 'KATUP FLUSH', tt: 'Bilas Membran', rows: [['Aliran', 'rendah'], ['Kapan', 'saat start & stop']], x: 1360, y: 200, t0: 21.6, t1: 99, anchor: S(an.flush) });

window.renderFrame = (tl) => {
  const t = waktu(tl);
  camAt(t);
  const fl = t > 21.4;
  jalan(fHP, t, 0, 0.01, fl ? 21.4 : 1e9);
  jalan(fProd, t, 0.4, 1.6, fl ? 21.6 : 1e9); jalan(fProd2, t, 6.9, 2.4, fl ? 21.6 : 1e9);
  jalan(fConc, t, 12.6, 1.6, fl ? 21.6 : 1e9); jalan(fDrain, t, 18.6, 0.8); jalan(fDrain2, t, 19.2, 0.6);
  jalan(fFlush, t, 22.4, 1.2);
  pt.fv.set(t > 22.0);
  pt.nv.handle.rotation.y = t > 15.6 && t < 18.0 ? Math.sin((t - 15.6) * 2.6) * 0.5 : 0;
  pt.rmPr.set(t > 1.0 ? 0.45 + Math.sin(t * 3) * 0.02 : 0); pt.rmCo.set(t > 13 ? 0.7 + Math.sin(t * 3) * 0.02 : 0);
  pt.fiProd.set(t > 1.0 ? 0.3 : 0); pt.fiConc.set(t > 13 ? 0.7 : 0);
  pt.pgCx.set(t > 13 ? 40 : 0); pt.pgFeed.set(42); pt.pgConc.set(t > 13 ? 40 : 0);
  P.render();
  flash.style.opacity = 1 - easeInOut(prog(t, 0, 0.6));
  perbarui(t);
};
window._ready();
</script></body></html>
