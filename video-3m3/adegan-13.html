<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Adegan 13: Perawatan</title>
<link rel="stylesheet" href="../video/lib/overlay.css">
</head>
<body><div id="stage"></div>
<script>window.TIMING_DIR = 'tts/'; window.TAHAP = ['Intake', 'Sand Filter', 'Karbon Aktif', 'Cartridge', 'Dosing', 'HPP', 'Membran RO', 'Produk']; window.ready = new Promise((r) => (window._ready = r));</script>
<script type="importmap">{ "imports": { "three": "../video/node_modules/three/build/three.module.js", "three/addons/": "../video/node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { kamera } from '../video/lib/dunia.js';
import { siapkanAdegan, chip, bug, kartu, penanda, el, perbarui, waktu } from '../video/lib/overlay.js';
import { prog, easeInOut, clamp, lerp } from '../video/lib/common.js';
import { WARNA } from '../video/lib/aliran.js';
import { panggungRuangMesin } from './lib/panggung3m3.js';
import { V, penunjuk, alir, jalan } from './lib/bantu.js';

const A = await siapkanAdegan(13);
const D = A.durasi;
const P = await panggungRuangMesin({ tertutup: true });
const { cam, scene, refs, conn } = P;
const S = penunjuk(cam), an = refs.anchors, Pp = refs.pipes;
const fBW = alir(conn.bw, '#a8743a', { parent: scene }), fBW1 = alir(Pp.bw1, '#a8743a', { parent: scene });
const fFl = alir(Pp.flush, WARNA.pre, { parent: scene, scale: 2.6 });
// tuas head katup tangki pertama
const lever = refs.parts.tanks[0].lever;
const bowl = refs.parts.carts[0].group.children[0];
const camAt = kamera(cam, [
  { t: 0, p: [3.4, 2.1, 3.8], l: [1.1, 1.0, 0], f: 40 },
  { t: 3.2, p: [-0.6, 2.4, 1.6], l: [0.55, 1.75, -0.18], f: 40 },
  { t: 6.4, p: [-0.5, 2.35, 1.5], l: [0.55, 1.7, -0.18], f: 40 },
  { t: 7.4, p: [1.25, 0.9, 1.9], l: [1.1, 0.6, 0.2], f: 40 },
  { t: 9.6, p: [1.2, 0.85, 1.75], l: [1.05, 0.55, 0.2], f: 40 },
  { t: 10.4, p: [2.8, 1.3, 1.6], l: [2.1, 1.0, 0.1], f: 40 },
  { t: 11.4, p: [2.7, 1.25, 1.5], l: [2.1, 1.0, 0.1], f: 40 },
  { t: D, p: [3.0, 1.6, 3.4], l: [1.1, 0.9, 0], f: 40 },
]);
const flash = el('', 'shade'); flash.style.background = '#06152c';
chip('12', 'Perawatan Sederhana', 'Semua komponen mudah dijangkau', -1, 0.3);
bug(0.2);
kartu({ k: 'PERAWATAN RUTIN', tt: 'Mudah & Terjadwal', rows: [['Media filter', 'backwash berkala'], ['Cartridge', 'ganti saat tekanan naik'], ['Membran', 'dibilas rutin']], x: 1360, y: 200, t0: 1.0, t1: 99 });
penanda('•', 'Tuas backwash', S(V(0.5, 1.83, -0.18)), 3.6, 6.6);
penanda('•', 'Ganti cartridge', S(V(0.92, 0.3, 0.3)), 7.8, 10.2, { kiri: true });
penanda('•', 'Bilas membran (flush)', S(an.flush), 10.4, 11.6, { kiri: true });

window.renderFrame = (tl) => {
  const t = waktu(tl);
  camAt(t);
  if (lever) lever.rotation.y = lerp(0, 2.1, easeInOut(prog(t, 3.8, 0.7))) * (1 - easeInOut(prog(t, 6.6, 0.5)));
  jalan(fBW1, t, 4.4, 0.8, 6.8); jalan(fBW, t, 5.0, 1.0, 6.8);
  refs.setPintu(easeInOut(prog(t, 6.6, 1.2)));
  const dn = easeInOut(prog(t, 8.0, 0.9)) * (1 - easeInOut(prog(t, 9.3, 0.9)));
  bowl.position.y = 0.49 - dn * 0.12; bowl.rotation.y = dn * 3;
  jalan(fFl, t, 10.4, 0.8);
  refs.parts.fv.set(t > 10.2 && t < 13);
  if (t > 6.5 && t < 8.0 || dn > 0) P.bayangan();
  P.render();
  flash.style.opacity = 1 - easeInOut(prog(t, 0, 0.6));
  perbarui(t);
};
window._ready();
</script></body></html>
