<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Adegan 7: Dosing antiscalant & biocide</title>
<link rel="stylesheet" href="../video/lib/overlay.css">
</head>
<body><div id="stage"></div>
<script>window.TIMING_DIR = 'tts/'; window.TAHAP = ['Intake', 'Sand Filter', 'Karbon Aktif', 'Cartridge', 'Dosing', 'HPP', 'Membran RO', 'Produk']; window.ready = new Promise((r) => (window._ready = r));</script>
<script type="importmap">{ "imports": { "three": "../video/node_modules/three/build/three.module.js", "three/addons/": "../video/node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { kamera } from '../video/lib/dunia.js';
import { siapkanAdegan, chip, bug, kartu, penanda, el, perbarui, waktu } from '../video/lib/overlay.js';
import { prog, easeInOut, clamp } from '../video/lib/common.js';
import { WARNA } from '../video/lib/aliran.js';
import { panggungRuangMesin } from './lib/panggung3m3.js';
import { V, penunjuk, alir, jalan } from './lib/bantu.js';

const A = await siapkanAdegan(7);
const D = A.durasi;
const P = await panggungRuangMesin({ tertutup: false });
const { cam, scene, refs } = P;
const S = penunjuk(cam), Pp = refs.pipes;
const fCart = alir(Pp.cart, WARNA.pre, { parent: scene }), fHP = alir(Pp.toHP, WARNA.pre, { parent: scene });
const fDose = alir(Pp.dose, WARNA.kimia, { parent: scene, scale: 2.2, spacing: 0.05, speed: 0.25 });
const camAt = kamera(cam, [
  { t: 0, p: [2.6, 1.0, 1.7], l: [1.8, 0.55, 0.1], f: 40 },
  { t: 3.0, p: [2.35, 0.9, 1.15], l: [1.9, 0.62, 0.15], f: 40 },
  { t: 7.2, p: [2.25, 0.82, 0.95], l: [1.9, 0.66, 0.12], f: 40 },
  { t: 15.8, p: [2.15, 0.85, 1.0], l: [1.84, 0.7, 0.08], f: 40 },
  { t: D, p: [2.7, 1.1, 1.6], l: [1.75, 0.6, 0.0], f: 40 },
]);
const flash = el('', 'shade'); flash.style.background = '#06152c';
chip('6', 'Dosing Kimia', 'Antiscalant & biocide', 4, 0.3);
bug(0.2);
kartu({ k: 'POMPA DOSING', tt: 'Injeksi Dosis Kecil', rows: [['Kimia', 'antiscalant & biocide'], ['Titik injeksi', 'sebelum pompa HP']], x: 1360, y: 210, t0: 2.9, t1: 7.3, anchor: S(V(1.89, 0.72, 0.23)) });
penanda('•', 'Titik injeksi', S(V(1.80, 0.82, 0.1)), 4.4, 7.3, { kiri: true });
kartu({ k: 'ANTISCALANT', tt: 'Mencegah Kerak', rows: [['Contoh mineral', 'kalsium karbonat (CaCO₃)'], ['Tanpa antiscalant', 'mengendap di membran']], x: 1360, y: 210, t0: 7.5, t1: 11.7 });
kartu({ k: 'BIOCIDE', tt: 'Mencegah Biofouling', rows: [['Menghambat', 'bakteri & lumut'], ['Di mana', 'permukaan membran']], x: 1360, y: 210, t0: 11.8, t1: 16.0 });
kartu({ k: 'HASIL', tt: 'Membran Tetap Bersih', rows: [['Kinerja', 'lebih stabil'], ['Umur membran', 'lebih panjang']], x: 1360, y: 210, t0: 16.2, t1: 99 });
penanda('•', 'Tangki dosing', S(V(1.93, 0.42, 0.29)), 3.4, 7.3);

window.renderFrame = (tl) => {
  const t = waktu(tl);
  camAt(t);
  jalan(fCart, t, 0, 0.01); jalan(fHP, t, 0.3, 1.8); jalan(fDose, t, 3.2, 1.0);
  const pulse = t > 3.0 ? 1 + 0.12 * Math.max(0, Math.sin(t * 9)) : 1;
  refs.parts.dosingHead.scale.set(pulse, pulse, 1);
  P.render();
  flash.style.opacity = 1 - easeInOut(prog(t, 0, 0.6));
  perbarui(t);
};
window._ready();
</script></body></html>
