<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Gaya A: Isometrik 2.5D</title>
<link rel="stylesheet" href="lib/common.css">
<style>
  body { background: radial-gradient(ellipse at 50% 40%, #16375f 0%, #0c2342 55%, #071629 100%); color: #fff; }
  canvas { position: absolute; inset: 0; }
  .chip { left: 80px; top: 70px; display: flex; align-items: center; gap: 18px; }
  .chip .no { font-weight: 800; font-size: 30px; color: #0c2342; background: #4fc3f7; border-radius: 10px; padding: 6px 14px; }
  .chip .tt { font-weight: 700; font-size: 34px; letter-spacing: .3px; }
  .chip .sub { font-weight: 400; font-size: 20px; color: #9ec9ec; margin-top: 2px; }
  .gauge { right: 90px; top: 70px; width: 340px; padding: 22px 26px 18px; background: rgba(255,255,255,.96); border-radius: 22px; color: #0c2342; box-shadow: 0 20px 50px rgba(0,0,0,.35); text-align: center; }
  .gauge .lbl { font-weight: 600; font-size: 18px; color: #4a6788; text-transform: uppercase; letter-spacing: 2px; }
  .gauge .val { font-weight: 800; font-size: 64px; line-height: 1; margin-top: 4px; }
  .gauge .val small { font-size: 26px; font-weight: 700; color: #1e88e5; margin-left: 6px; }
  .gauge .typ { font-size: 19px; color: #1e88e5; font-weight: 700; margin-top: 8px; }
  .call { font-weight: 700; font-size: 22px; color: #0c2342; background: #fff; padding: 9px 16px; border-radius: 12px; white-space: nowrap; box-shadow: 0 10px 25px rgba(0,0,0,.3); }
  .call::after { content: ''; position: absolute; left: 50%; bottom: -12px; margin-left: -1.5px; width: 3px; height: 12px; background: #fff; }
  .call .dot { position: absolute; left: 50%; bottom: -60px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #4fc3f7; box-shadow: 0 0 0 6px rgba(79,195,247,.3); }
  .call .stem { position: absolute; left: 50%; bottom: -52px; width: 3px; height: 42px; margin-left: -1.5px; background: #fff; }
  .subs { left: 50%; bottom: 64px; transform: translateX(-50%); }
  #sub { display: inline-block; font-weight: 600; font-size: 40px; padding: 12px 30px; background: rgba(7,22,41,.78); border-radius: 14px; white-space: nowrap; }
  .logo { right: 90px; bottom: 70px; font-weight: 800; font-size: 26px; letter-spacing: 4px; color: rgba(255,255,255,.55); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="ov chip" id="chip"><div class="no">06</div><div><div class="tt">Pompa Tekanan Tinggi</div><div class="sub">High Pressure Pump</div></div></div>
<div class="ov gauge" id="gauge">
  <div class="lbl">Tekanan umpan</div>
  <svg width="288" height="170" viewBox="0 0 288 170">
    <path d="M24 150 A120 120 0 0 1 264 150" fill="none" stroke="#e3edf7" stroke-width="20" stroke-linecap="round"/>
    <path id="band" fill="none" stroke="#4fc3f7" stroke-width="20"/>
    <path id="arc" fill="none" stroke="#1e88e5" stroke-width="8" stroke-linecap="round"/>
    <line id="needle" x1="144" y1="150" x2="144" y2="74" stroke="#0c2342" stroke-width="6" stroke-linecap="round"/>
    <circle cx="144" cy="150" r="11" fill="#0c2342"/>
  </svg>
  <div class="val"><span id="num">0</span><small>bar</small></div>
  <div class="typ">tipikal 55–70 bar</div>
</div>
<div class="ov call" id="c1">Pompa tekanan tinggi<span class="stem"></span><span class="dot"></span></div>
<div class="ov call" id="c2">Membran RO spiral-wound<span class="stem"></span><span class="dot"></span></div>
<div class="ov subs"><span id="sub"></span></div>
<div class="ov logo">TRAYA</div>

<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { buildPlant, updatePlant } from './lib/plant3d.js';
import { prog, easeOut, easeInOut, lerp, subtitle, reveal } from './lib/common.js';

const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const L = (c) => new THREE.MeshLambertMaterial({ color: c });
const M = {
  housing: L('#e8f1fa'), flange: L('#8fb3d9'), frame: L('#2b5c8f'), skid: L('#1c4a7a'),
  motor: L('#1e88e5'), motorFin: L('#1673c4'), pump: L('#dfe9f5'), accent: L('#ffb74d'),
  vessel: L('#f4f8fc'), vesselCap: L('#1e88e5'), pipe: L('#b9d3ec'),
  pipeFlow: new THREE.MeshLambertMaterial({ color: '#ffffff' }), flowBase: '#9fd3f5', flowStripe: '#ffffff',
};
const outline = new THREE.LineBasicMaterial({ color: '#0c2342', transparent: true, opacity: 0.35 });
const { root, anim } = buildPlant(M, { outline });
scene.add(root);

// Platform bulat di bawah peralatan
const plat = new THREE.Mesh(new THREE.BoxGeometry(19, 0.3, 5.2), L('#1b4473'));
plat.position.set(1.8, -0.15, 0); plat.receiveShadow = true; scene.add(plat);
const top = new THREE.Mesh(new THREE.PlaneGeometry(19, 5.2), new THREE.ShadowMaterial({ opacity: 0.28 }));
top.rotation.x = -Math.PI / 2; top.position.set(1.8, 0.001, 0); top.receiveShadow = true; scene.add(top);
const grid = new THREE.GridHelper(19, 38, '#2c5f94', '#2c5f94'); grid.scale.z = 5.2 / 19; grid.position.set(1.8, 0.003, 0); scene.add(grid);

scene.add(new THREE.HemisphereLight('#ffffff', '#335a85', 1.6));
const sun = new THREE.DirectionalLight('#ffffff', 2.2);
sun.position.set(-6, 14, 9); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 10, bottom: -10, near: 1, far: 40 });
sun.shadow.radius = 4;
scene.add(sun);

const aspect = W / H;
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -100, 100);
function setCam(t) {
  const half = lerp(6.6, 6.0, easeInOut(prog(t, 0, 8)));
  cam.left = -half * aspect; cam.right = half * aspect; cam.top = half; cam.bottom = -half;
  const cx = lerp(-1.2, 2.6, easeInOut(prog(t, 0.5, 7)));
  const target = new THREE.Vector3(cx, 1.3, 0);
  cam.position.copy(target).add(new THREE.Vector3(10, 8.2, 10));
  cam.lookAt(target);
  cam.updateProjectionMatrix();
}

const $ = (id) => document.getElementById(id);
function pinTo(el, p) {
  const v = p.clone().project(cam);
  const x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H;
  el.style.left = (x - el.offsetWidth / 2) + 'px';
  el.style.top = (y - el.offsetHeight - 60) + 'px';
}
function arcPath(v0, v1) {
  const a = (v) => Math.PI + (v / 80) * Math.PI;
  const p = (v) => [144 + 120 * Math.cos(a(v)), 150 + 120 * Math.sin(a(v))];
  const [x0, y0] = p(v0), [x1, y1] = p(v1);
  return `M${x0} ${y0} A120 120 0 0 1 ${x1} ${y1}`;
}
$('band').setAttribute('d', arcPath(55, 70));

window.renderFrame = (t) => {
  setCam(t);
  const pressure = 62 * easeInOut(prog(t, 2.4, 2.6));
  updatePlant(anim, t, pressure / 62);
  renderer.render(scene, cam);
  document.body.style.opacity = 1;
  $('stage').style.opacity = easeOut(prog(t, 0, 0.8));

  reveal($('chip'), t, 0.3);
  reveal($('gauge'), t, 2.0);
  $('num').textContent = Math.round(pressure);
  $('arc').setAttribute('d', arcPath(0, Math.max(pressure, 0.01)));
  $('needle').setAttribute('transform', `rotate(${-90 + pressure / 80 * 180} 144 150)`);

  const c1 = $('c1'), c2 = $('c2');
  pinTo(c1, new THREE.Vector3(-1.4, 1.25, 0));
  pinTo(c2, new THREE.Vector3(4.2, 2.6, 0));
  c1.style.opacity = easeOut(prog(t, 1.4, 0.5));
  c2.style.opacity = easeOut(prog(t, 5.2, 0.5));
  subtitle($('sub'), t);
};
window.ready = Promise.resolve();
</script>
</body>
</html>
