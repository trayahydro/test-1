<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Gaya B: 3D Sinematik</title>
<link rel="stylesheet" href="lib/common.css">
<style>
  body { background: #050f1f; color: #fff; }
  canvas { position: absolute; inset: 0; }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(2,8,18,.75) 100%), linear-gradient(180deg, rgba(3,10,22,.7) 0%, transparent 28%, transparent 78%, rgba(3,10,22,.7) 100%); }
  .chip { left: 96px; top: 84px; }
  .chip .k { font-weight: 700; font-size: 20px; letter-spacing: 6px; color: #5fd4ff; display: flex; align-items: center; gap: 14px; }
  .chip .k i { display: inline-block; width: 60px; height: 2px; background: #5fd4ff; }
  .chip .tt { font-weight: 300; font-weight: 400; font-size: 56px; margin-top: 10px; letter-spacing: -.5px; }
  .hud { right: 96px; top: 84px; width: 300px; padding: 26px 0 24px; text-align: center; background: rgba(10,30,60,.55); border: 1px solid rgba(120,200,255,.25); border-radius: 20px; backdrop-filter: blur(10px); }
  .hud .lbl { font-size: 16px; letter-spacing: 4px; color: #8fc7ef; font-weight: 600; }
  .hud .ring { position: relative; width: 200px; height: 200px; margin: 14px auto 6px; }
  .hud .ring .n { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hud .ring .n b { font-size: 66px; font-weight: 700; line-height: 1; }
  .hud .ring .n span { font-size: 20px; color: #8fc7ef; }
  .hud .typ { font-size: 18px; color: #5fd4ff; font-weight: 600; }
  .lead { color: #dff3ff; font-size: 20px; font-weight: 600; letter-spacing: 1px; white-space: nowrap; }
  .lead .ln { position: absolute; left: 0; top: 50%; height: 1.5px; background: #5fd4ff; transform-origin: left center; }
  .lead .pt { position: absolute; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #5fd4ff; background: rgba(95,212,255,.25); }
  .lead .tx { position: absolute; padding: 0 0 6px; border-bottom: 1.5px solid #5fd4ff; }
  .subs { left: 0; right: 0; bottom: 70px; text-align: center; }
  #sub { font-weight: 600; font-size: 42px; text-shadow: 0 2px 4px rgba(0,0,0,.9), 0 0 24px rgba(0,0,0,.7); }
  .logo { left: 96px; bottom: 72px; font-weight: 800; font-size: 24px; letter-spacing: 5px; color: rgba(255,255,255,.5); }
</style>
</head>
<body>
<div id="stage"></div>
<div class="vig"></div>
<div class="ov chip" id="chip"><div class="k"><i></i>TAHAP 06</div><div class="tt">Pompa Tekanan Tinggi</div></div>
<div class="ov hud" id="hud">
  <div class="lbl">TEKANAN UMPAN</div>
  <div class="ring">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(120,200,255,.15)" stroke-width="10"/>
      <circle id="band" cx="100" cy="100" r="86" fill="none" stroke="rgba(95,212,255,.35)" stroke-width="10" transform="rotate(-90 100 100)"/>
      <circle id="ring" cx="100" cy="100" r="86" fill="none" stroke="#5fd4ff" stroke-width="6" stroke-linecap="round" transform="rotate(-90 100 100)"/>
    </svg>
    <div class="n"><b id="num">0</b><span>bar</span></div>
  </div>
  <div class="typ">tipikal 55–70 bar</div>
</div>
<div class="ov lead" id="l1"><div class="pt"></div><div class="ln"></div><div class="tx">POMPA TEKANAN TINGGI</div></div>
<div class="ov lead" id="l2"><div class="pt"></div><div class="ln"></div><div class="tx">MEMBRAN RO SPIRAL-WOUND</div></div>
<div class="ov subs"><span id="sub"></span></div>
<div class="ov logo">TRAYA</div>

<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildPlant, updatePlant } from './lib/plant3d.js';
import { prog, easeOut, easeInOut, subtitle, reveal } from './lib/common.js';

const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#06142a');
scene.fog = new THREE.Fog('#06142a', 9, 26);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const S = (o) => new THREE.MeshStandardMaterial(o);
const steel = S({ color: '#c9d4e0', metalness: 0.9, roughness: 0.28 });
const M = {
  housing: steel, flange: S({ color: '#9fb0c4', metalness: 0.9, roughness: 0.35 }),
  frame: S({ color: '#1d3f6b', metalness: 0.4, roughness: 0.5 }), skid: S({ color: '#13304f', metalness: 0.5, roughness: 0.55 }),
  motor: S({ color: '#1565c0', metalness: 0.3, roughness: 0.35 }), motorFin: S({ color: '#0f4f99', metalness: 0.3, roughness: 0.4 }),
  pump: steel, accent: S({ color: '#ffa726', metalness: 0.4, roughness: 0.4 }),
  vessel: new THREE.MeshPhysicalMaterial({ color: '#cfe9ff', metalness: 0, roughness: 0.08, transparent: true, opacity: 0.22, clearcoat: 1, depthWrite: false }),
  vesselCap: S({ color: '#1e88e5', metalness: 0.5, roughness: 0.3 }),
  membrane: S({ color: '#b9cadb', metalness: 0.1, roughness: 0.55 }),
  permeate: S({ color: '#4fc3f7', emissive: '#0a6fa8', roughness: 0.4 }),
  pipe: steel,
  pipeFlow: S({ color: '#ffffff', metalness: 0.6, roughness: 0.3, emissive: '#ffffff', emissiveIntensity: 0.35 }),
  flowBase: '#7d93ab', flowStripe: '#6fe0ff', flowEmissive: true,
  particle: new THREE.MeshBasicMaterial({ color: '#5fe8ff' }),
  ground: S({ color: '#0b1d36', metalness: 0.2, roughness: 0.55 }),
};
const { root, anim } = buildPlant(M, { particles: true });
scene.add(root);

scene.add(new THREE.HemisphereLight('#9fd0ff', '#06142a', 0.6));
const key = new THREE.SpotLight('#ffffff', 900, 40, 0.6, 0.6, 2);
key.position.set(-4, 11, 8); key.target.position.set(1, 1, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight('#3fb6ff', 2.2); rim.position.set(6, 4, -8); scene.add(rim);
const fill = new THREE.PointLight('#4fc3f7', 25, 10); fill.position.set(3.5, 3.4, 2); scene.add(fill);

const cam = new THREE.PerspectiveCamera(36, W / H, 0.1, 100);
const posPath = new THREE.CatmullRomCurve3([new THREE.Vector3(-7.0, 1.9, 5.6), new THREE.Vector3(-3.4, 2.5, 7.0), new THREE.Vector3(1.6, 3.2, 8.4), new THREE.Vector3(7.0, 3.7, 8.2)]);
const lookPath = new THREE.CatmullRomCurve3([new THREE.Vector3(-2.0, 1.0, 0), new THREE.Vector3(-0.6, 1.2, 0), new THREE.Vector3(2.6, 1.4, 0), new THREE.Vector3(4.2, 1.5, 0)]);
function setCam(t) {
  const u = easeInOut(prog(t, 0, 8));
  cam.position.copy(posPath.getPointAt(u));
  cam.lookAt(lookPath.getPointAt(u));
}

const $ = (id) => document.getElementById(id);
const C = 2 * Math.PI * 86;
$('band').setAttribute('stroke-dasharray', `${C * 15 / 80} ${C}`);
$('band').setAttribute('stroke-dashoffset', `${-C * 55 / 80}`);

function screen(p) { const v = p.clone().project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; }
// Garis penunjuk: titik di objek, garis diagonal ke label
function lead(el, p, dx, dy, t0, t, t1 = Infinity) {
  const [x, y] = screen(p);
  const k = easeOut(prog(t, t0, 0.7));
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.style.opacity = Math.min(1, prog(t, t0, 0.2) * 5) * (1 - prog(t, t1, 0.4));
  const pt = el.querySelector('.pt'), ln = el.querySelector('.ln'), tx = el.querySelector('.tx');
  pt.style.left = '-6px'; pt.style.top = '-6px';
  const len = Math.hypot(dx, dy);
  ln.style.top = '0'; ln.style.width = len * k + 'px';
  ln.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
  tx.style.left = dx + 'px'; tx.style.top = (dy - 34) + 'px';
  tx.style.opacity = prog(t, t0 + 0.5, 0.4);
}

window.renderFrame = (t) => {
  setCam(t);
  const pressure = 62 * easeInOut(prog(t, 2.4, 2.6));
  updatePlant(anim, t, pressure / 62);
  renderer.render(scene, cam);
  $('stage').style.opacity = easeOut(prog(t, 0, 1.0));

  reveal($('chip'), t, 0.4, 0.8, 20);
  reveal($('hud'), t, 2.0, 0.8, 20);
  $('num').textContent = Math.round(pressure);
  $('ring').setAttribute('stroke-dasharray', `${C * pressure / 80} ${C}`);

  lead($('l1'), new THREE.Vector3(-1.35, 1.25, 0.2), 90, -120, 1.3, t, 4.6);
  lead($('l2'), new THREE.Vector3(3.8, 2.6, 0.2), 110, -110, 5.0, t);
  subtitle($('sub'), t);
};
window.ready = Promise.resolve();
</script>
</body>
</html>
