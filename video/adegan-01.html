<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Adegan 1: Tantangan Air Pesisir</title>
<link rel="stylesheet" href="lib/overlay.css">
<style>
  .ikon { position: absolute; display: flex; gap: 22px; left: 50%; top: 150px; transform: translateX(-50%); }
  .ikon div { opacity: 0; width: 300px; padding: 18px 20px; border-radius: 16px; background: rgba(8,24,48,.86); border: 1px solid rgba(255,140,120,.45); text-align: center; }
  .ikon b { display: block; font-size: 25px; font-weight: 800; }
  .ikon span { display: block; font-size: 18px; color: #ffc9bd; margin-top: 4px; }
  .ikon i { display: block; font-style: normal; font-size: 34px; color: #ff8a70; font-weight: 800; }
</style></head>
<body><div id="stage"></div>
<script>window.ready = new Promise((r) => (window._ready = r));</script>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { buatDunia, kamera, layar, latarStudio, loadImg } from './lib/dunia.js';
import { buatDiorama, rumah, kelapa, sumur, truk, resor, pabrik, dermaga, h, DZ } from './lib/diorama.js';
import { makeMaterials, buildSWRO } from './lib/model.js';
import { siapkanAdegan, chip, bug, penanda, kartu, el, muncul, perbarui, waktu } from './lib/overlay.js';
import { prog, easeOut, easeInOut, lerp } from './lib/common.js';

const A = await siapkanAdegan(1);
const D = A.durasi;
const { scene, cam, pmrem, render } = buatDunia({ ao: false, bloom: 0.1, exposure: 1.0 });
latarStudio(scene, pmrem);
scene.add(new THREE.HemisphereLight('#e6f2ff', '#3a4a5a', 0.7));
const sun = new THREE.DirectionalLight('#fff4e0', 2.6); sun.position.set(-6, 14, 9); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 9, bottom: -9, near: 1, far: 50 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

const dio = buatDiorama(scene, { mode: 'intrusi' });
const G = dio.G;
// jalan
const road = new THREE.Mesh(new THREE.PlaneGeometry(9.6, 0.7), new THREE.MeshStandardMaterial({ color: '#5b6066', roughness: 0.9 }));
road.rotation.x = -Math.PI / 2; road.position.set(-5.2, h(-5) + 0.012, 1.95); road.receiveShadow = true; G.add(road);
// permukiman
[[-8.6, -1.9, 'R'], [-7.1, -2.0, 'O'], [-5.6, -1.9, 'B'], [-8.2, -0.4, 'O'], [-6.6, -0.5, 'R'], [-5.0, -0.4, 'R'], [-7.6, 0.85, 'R']].forEach(([x, z, at], i) => rumah(G, x, z, { atap: at, rot: (i % 3 - 1) * 0.12 }));
pabrik(G, -9.0, -0.0).position.z = -0.5;
resor(G, -2.2, -1.8);
[[-1.6, 1.0], [-0.9, -0.4], [-0.3, 1.6], [0.2, -2.3], [-1.3, 2.4], [-4.3, -2.3], [-9.4, 2.3]].forEach(([x, z], i) => kelapa(G, x, z, 1.3 + (i % 3) * 0.25, i + 3));
sumur(G, -5.2, 1.15);
const pier = dermaga(G, 0.6, 5.0, -1.4);
const trk = truk(G, -10.5, 1.95);
// pipa sumur pada penampang (setengah menonjol di muka potong)
const well = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.45, 16), new THREE.MeshStandardMaterial({ color: '#9aa3ab', roughness: 0.5 }));
well.position.set(-5.2, h(-5.2) - 1.2, DZ / 2); G.add(well);

// miniatur kontainer Traya (muncul di akhir sebagai solusi)
const logos = { dark: await loadImg('../logo/traya-logo-putih.png'), light: await loadImg('../traya-logo.png') };
await document.fonts.ready;
const M = makeMaterials(logos);
const { root: cont, refs } = buildSWRO(M, logos);
refs.pad.visible = false; refs.exterior.visible = false;
const SC = 0.25, CX = -3.4, CZ = 0.35, CY = 0.16 * SC + 0.03;
cont.scale.setScalar(SC); cont.position.set(CX, CY, CZ);
scene.add(cont);
const glow = new THREE.Mesh(new THREE.BoxGeometry(12.4 * SC, 3.0 * SC, 2.6 * SC), new THREE.MeshBasicMaterial({ color: '#6ec3ff', transparent: true, opacity: 0, depthWrite: false }));
glow.position.set(CX + 6.0 * SC, CY + 1.29 * SC, CZ); scene.add(glow);

const camAt = kamera(cam, [
  { t: 0, p: [4, 7.5, 13], l: [-3, -0.5, 0], f: 38 },
  { t: 3.4, p: [1.5, 4.5, 12], l: [-3, -1.0, 1], f: 38 },
  { t: 7.6, p: [-2.6, 1.0, 10.2], l: [-3.6, -1.35, 2.5], f: 40 },
  { t: 9.0, p: [-2.8, 1.2, 10.0], l: [-3.8, -1.2, 2.4], f: 40 },
  { t: 13.6, p: [-7.2, 3.0, 8.8], l: [-5.2, -0.3, 0.8], f: 40 },
  { t: 18.4, p: [2.6, 6.8, 12.6], l: [-3.2, -0.3, -0.2], f: 40 },
  { t: 24.4, p: [3.4, 7.0, 12.8], l: [-3.2, -0.3, 0], f: 40 },
  { t: D, p: [-2.2, 3.4, 8.2], l: [-4.0, 0.1, 0.6], f: 38 },
]);

chip('!', 'Tantangan Air Bersih di Pesisir', '', -1, 0.3);
bug(0.2);
const S = (p) => (t) => { const s = layar(cam, p); return s[2] < 1 ? s : null; };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
penanda('≈', 'Air tanah tawar', S(V(-7.6, -0.95, DZ / 2)), 4.2, 13.2, { kiri: true });
penanda('!', 'Intrusi air laut', S(V(-1.8, -2.3, DZ / 2)), 5.0, 13.2);
penanda('!', 'Sumur terasa payau', S(V(-5.2, -2.35, DZ / 2)), 6.0, 13.2);
penanda('1', 'Permukiman', S(V(-6.6, 1.0, -0.5)), 14.8, 19.2, { kiri: true });
penanda('2', 'Resor', S(V(-2.2, 1.4, -1.8)), 15.7, 19.2);
penanda('3', 'Pelabuhan', S(V(3.2, 0.0, -1.4)), 16.6, 19.2);
penanda('4', 'Kawasan industri', S(V(-9.0, 1.7, -0.5)), 17.6, 19.2, { kiri: true });
penanda('✓', 'Solusi: SWRO Traya', S(V(-1.9, 0.9, 0.35)), 27.2, 99);

// kartu tantangan & dampak
const ik1 = el('<div><i>⌁</i><b>Sumber air terbatas</b><span>air permukaan sedikit</span></div><div><i>Rp</i><b>Pasokan mahal</b><span>truk tangki, tidak selalu andal</span></div>', 'ikon');
const ik2 = el('<div><i>+</i><b>Kesehatan</b><span>air payau tak layak</span></div><div><i>Rp</i><b>Biaya operasional</b><span>pengadaan air tinggi</span></div><div><i>↗</i><b>Pertumbuhan usaha</b><span>terhambat</span></div>', 'ikon');
const fade = (node, a0, a1, kids) => [...node.children].forEach((c, i) => muncul(c, a0 + i * 0.7, a1));
fade(ik1, 8.0, 14.3); fade(ik2, 19.0, 24.8);

window.renderFrame = (tl) => {
  const t = waktu(tl);
  camAt(t);
  dio.update(t);
  // truk tangki melaju di jalan
  const tx = lerp(-10.8, -0.8, easeInOut(prog(t, 8.6, 6.0)));
  trk.position.set(tx, h(tx), 1.95);
  pier.perahu.position.y = -0.55 + 0.06 + Math.sin(t * 1.5) * 0.02; pier.perahu.rotation.z = Math.sin(t * 1.1) * 0.03;
  // kontainer solusi muncul
  const k = easeOut(prog(t, 25.6, 1.4));
  cont.visible = k > 0.001; cont.position.y = CY + (1 - k) * 1.2;
  glow.material.opacity = 0.35 * Math.sin(Math.min(1, prog(t, 25.6, 2.4)) * Math.PI); glow.position.y = cont.position.y + 1.29 * SC;
  glow.visible = glow.material.opacity > 0.002; // objek tak terlihat jangan ikut pass AO
  render();
  perbarui(t);
};
window._ready();
</script></body></html>
