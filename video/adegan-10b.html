<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Adegan 10b: Elemen spiral-wound</title>
<link rel="stylesheet" href="lib/overlay.css">
</head>
<body><div id="stage"></div>
<script>window.ready = new Promise((r) => (window._ready = r));</script>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { buatDunia, kamera, layar, latarStudio } from './lib/dunia.js';
import { siapkanAdegan, chip, bug, kartu, penanda, perbarui, waktu } from './lib/overlay.js';
import { prog, easeOut, easeInOut, lerp, clamp } from './lib/common.js';
import { rng } from './lib/tekstur.js';
import { WARNA } from './lib/aliran.js';

const T0 = 15.2, T1 = 48.4;
const A = await siapkanAdegan(10, { dari: T0, ke: T1 });
const { scene, cam, pmrem, render } = buatDunia({ ao: false, bloom: 0.12, exposure: 0.95 });
latarStudio(scene, pmrem);
scene.add(new THREE.HemisphereLight('#dcecff', '#223344', 0.6));
const key = new THREE.DirectionalLight('#ffffff', 2.0); key.position.set(2, 4, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2, right: 3, top: 2, bottom: -2, near: 1, far: 20 }); key.shadow.bias = -0.0005; scene.add(key);
const rim = new THREE.DirectionalLight('#6ec3ff', 1.4); rim.position.set(-3, 2, -3); scene.add(rim);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const R = rng(101);
const canvasTex = (w, h, draw, rep = [1, 1]) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); return t; };

// ---------- tekstur ----------
const texSpacer = canvasTex(128, 128, (g) => { g.clearRect(0, 0, 128, 128); g.strokeStyle = '#3f8fd8'; g.lineWidth = 9; g.beginPath(); g.moveTo(0, 0); g.lineTo(128, 128); g.moveTo(128, 0); g.lineTo(0, 128); g.stroke(); });
const texMem = canvasTex(256, 256, (g) => { g.fillStyle = '#f2f4f6'; g.fillRect(0, 0, 256, 256); for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(150,160,175,${R() * 0.12})`; g.fillRect(R() * 256, R() * 256, 2, 2); } });
const texCar = canvasTex(64, 64, (g) => { g.fillStyle = '#3d4248'; g.fillRect(0, 0, 64, 64); g.strokeStyle = '#555c64'; g.lineWidth = 3; for (let y = 4; y < 64; y += 8) { g.beginPath(); for (let x = 0; x <= 64; x += 8) g.lineTo(x, y + ((x / 8) % 2 ? 3 : -3)); g.stroke(); } });
const texWrap = canvasTex(512, 128, (g) => { g.fillStyle = '#efe7cf'; g.fillRect(0, 0, 512, 128); g.strokeStyle = 'rgba(160,140,100,.35)'; g.lineWidth = 3; for (let x = -128; x < 512; x += 22) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 128, 128); g.stroke(); } });
const texSpiral = canvasTex(512, 512, (g) => {
  g.fillStyle = '#2f3439'; g.fillRect(0, 0, 512, 512);
  const cols = ['#f2f4f6', '#3f8fd8', '#f2f4f6', '#4a5058'];
  for (let k = 0; k < 4; k++) { g.strokeStyle = cols[k]; g.lineWidth = 6; g.beginPath(); for (let a = 0; a < Math.PI * 2 * 9; a += 0.05) { const r = 34 + (a / (Math.PI * 2)) * 24 + k * 6; g.lineTo(256 + Math.cos(a) * r, 256 + Math.sin(a) * r); } g.stroke(); }
  g.fillStyle = '#8f99a3'; g.beginPath(); g.arc(256, 256, 30, 0, 7); g.fill(); g.fillStyle = '#20252a'; g.beginPath(); g.arc(256, 256, 18, 0, 7); g.fill();
});
const texTube = canvasTex(128, 64, (g) => { g.fillStyle = '#9aa3ab'; g.fillRect(0, 0, 128, 64); g.fillStyle = '#20262c'; for (let x = 8; x < 128; x += 16) for (let y = 8; y < 64; y += 16) { g.beginPath(); g.arc(x, y, 3.5, 0, 7); g.fill(); } }, [6, 2]);

// ---------- elemen utuh (gulungan) ----------
const ER = 0.1, LEN = 1.0;
const rollG = new THREE.Group(); scene.add(rollG);
const wrapMat = new THREE.MeshStandardMaterial({ map: texWrap, roughness: 0.7, transparent: true });
const wrap = new THREE.Mesh(new THREE.CylinderGeometry(ER + 0.004, ER + 0.004, LEN, 64, 1, true), wrapMat); wrap.rotation.x = Math.PI / 2; rollG.add(wrap);
const core = new THREE.Mesh(new THREE.CylinderGeometry(ER, ER, LEN, 64, 1, true), new THREE.MeshStandardMaterial({ map: texMem.clone(), roughness: 0.6 })); core.rotation.x = Math.PI / 2; rollG.add(core);
const caps = [-1, 1].map((s) => { const c = new THREE.Mesh(new THREE.CircleGeometry(ER, 64), new THREE.MeshStandardMaterial({ map: texSpiral, roughness: 0.6 })); c.position.z = s * LEN / 2; if (s < 0) c.rotation.y = Math.PI; rollG.add(c); return c; });
const atd = [-1, 1].map((s) => { const a = new THREE.Mesh(new THREE.TorusGeometry(ER + 0.004, 0.012, 10, 48), new THREE.MeshStandardMaterial({ color: '#6b4f33', roughness: 0.6, transparent: true })); a.position.z = s * (LEN / 2 + 0.006); rollG.add(a); return a; });
const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.021, LEN + 0.16, 24), new THREE.MeshStandardMaterial({ map: texTube, roughness: 0.4 })); tube.rotation.x = Math.PI / 2; scene.add(tube);
rollG.traverse((o) => { if (o.isMesh) o.castShadow = true; });

// ---------- lembaran yang terbuka (4 lapis) ----------
const TH = 0.006, Y0 = -ER;
const LAYERS = [
  { n: 'membran', mat: new THREE.MeshStandardMaterial({ map: texMem.clone(), roughness: 0.55 }) },
  { n: 'carrier', mat: new THREE.MeshStandardMaterial({ map: texCar.clone(), roughness: 0.8 }) },
  { n: 'membran', mat: new THREE.MeshStandardMaterial({ map: texMem.clone(), roughness: 0.55 }) },
  { n: 'spacer', mat: new THREE.MeshStandardMaterial({ map: texSpacer.clone(), roughness: 0.5, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide }) },
];
LAYERS.forEach((L, i) => {
  const geo = new THREE.BoxGeometry(1, TH, LEN); geo.translate(0.5, 0, 0);
  L.mesh = new THREE.Mesh(geo, L.mat); L.mesh.castShadow = L.mesh.receiveShadow = true; scene.add(L.mesh);
  L.mat.map.repeat.set(i === 3 ? 16 : 4, i === 3 ? 10 : 2);
});
const yL = (i, ex) => Y0 + i * (TH + 0.065 * ex);

// ---------- partikel ----------
const NF = 160, NW = 110, NS = 70;
const mk = (n, col, r) => { const m = new THREE.InstancedMesh(new THREE.SphereGeometry(r, 8, 6), new THREE.MeshBasicMaterial({ color: col, toneMapped: false }), n); m.frustumCulled = false; scene.add(m); return m; };
const feedM = mk(NF, WARNA.hp, 0.008), watM = mk(NW, '#e6fbff', 0.009), saltM = mk(NS, WARNA.brine, 0.011);
const FD = Array.from({ length: NF }, () => ({ x: R(), ph: R() })), WD = Array.from({ length: NW }, () => ({ x: R(), z: R() * 0.9 - 0.45, ph: R() })), SD = Array.from({ length: NS }, () => ({ x: R(), ph: R() }));
const _m = new THREE.Matrix4(), HID = new THREE.Matrix4().makeScale(0, 0, 0);

const camAt = kamera(cam, [
  { t: 15.2, p: [0.95, 0.55, 1.9], l: [0.1, 0, 0], f: 38 },
  { t: 19.0, p: [0.32, 0.28, 1.25], l: [0, 0, 0.35], f: 38 },
  { t: 23.6, p: [1.7, 1.15, 2.2], l: [0.8, -0.05, 0], f: 38 },
  { t: 28.6, p: [1.6, 1.25, 2.05], l: [0.8, -0.02, 0], f: 38 },
  { t: 32.2, p: [1.15, 0.28, 0.95], l: [0.85, -0.02, 0.2], f: 36 },
  { t: 38.4, p: [1.05, 0.55, 1.5], l: [0.45, -0.05, 0.1], f: 38 },
  { t: 44.0, p: [1.5, 0.95, 2.3], l: [0.75, -0.05, 0.3], f: 38 },
  { t: T1, p: [1.6, 1.0, 2.4], l: [0.8, -0.05, 0.3], f: 38 },
]);
chip('6', 'Elemen Spiral-Wound', 'Membran RO', 6, T0 + 0.2);
bug(T0);
const S = (p) => (t) => { const s = layar(cam, p); return s[2] < 1 ? s : null; };
let Lnow = 0, EXnow = 0;
penanda('•', 'Membran poliamida', (t) => S(V(Lnow * 0.92, yL(2, EXnow), LEN / 2))(t), 19.8, 31.6);
penanda('•', 'Spacer umpan (jaring)', (t) => S(V(Lnow * 0.92, yL(3, EXnow), LEN / 2))(t), 21.8, 31.6);
penanda('•', 'Pembawa permeat', (t) => S(V(Lnow * 0.92, yL(1, EXnow), LEN / 2))(t), 23.8, 31.6);
penanda('•', 'Pipa pusat berlubang', S(V(0, 0, LEN / 2 + 0.07)), 25.8, 31.6, { kiri: true });
kartu({ k: 'LAPISAN AKTIF', tt: 'Celah ± 0,0001 µm', rows: [['Lolos', 'molekul air (H₂O)'], ['Tertahan', 'garam & pengotor']], x: 1360, y: 200, t0: 32.3, t1: 43.8 });
kartu({ k: 'KONSENTRAT', tt: 'Brine', rows: [['Isi', 'garam & pengotor tertahan'], ['Arah', 'keluar di ujung elemen']], x: 1360, y: 200, t0: 44.5, t1: 99 });
penanda('•', 'Permeat → pipa pusat', S(V(0.02, 0.02, LEN / 2 + 0.12)), 39.4, 43.8, { kiri: true });

window.renderFrame = (tl) => {
  const t = waktu(tl);
  camAt(t);
  // 1) elemen utuh berputar pelan; pembungkus memudar → ujung spiral terlihat
  const spin = t < 19.4 ? (t - T0) * 0.25 : 1.05;
  rollG.rotation.z = spin;
  const wf = easeInOut(prog(t, 16.0, 2.0));
  wrapMat.opacity = 1 - wf; wrap.visible = wf < 0.99;
  atd.forEach((a) => { a.material.opacity = 1 - wf; a.visible = wf < 0.99; });
  // 2) membuka gulungan → lembaran memanjang ke +x, lapisan terpisah (exploded)
  Lnow = 1.6 * easeInOut(prog(t, 19.4, 4.2));
  EXnow = easeInOut(prog(t, 22.2, 2.6)) * (1 - 0.65 * easeInOut(prog(t, 31.8, 1.2)));
  const r = lerp(ER, 0.075, Lnow / 1.6);
  rollG.scale.set(r / ER, r / ER, 1); rollG.position.y = r - ER;
  tube.position.y = r - ER;
  LAYERS.forEach((L, i) => {
    L.mesh.visible = Lnow > 0.01; L.mesh.scale.x = Math.max(0.001, Lnow); L.mesh.position.set(0.0, yL(i, EXnow), 0);
    L.mat.map.repeat.x = (i === 3 ? 16 : 4) * Lnow;
  });
  // 3) partikel aliran
  const yS = yL(3, EXnow) + 0.012, yC = yL(1, EXnow) + 0.004;
  FD.forEach((p, i) => {
    if (t < 28.6) { feedM.setMatrixAt(i, HID); return; }
    const u = (p.ph + t * 0.18) % 1;
    _m.makeTranslation(0.08 + p.x * (Lnow - 0.12), yS, lerp(-LEN / 2, LEN / 2 + (t > 44.3 ? 0.35 : 0), u)); feedM.setMatrixAt(i, _m);
  });
  WD.forEach((p, i) => {
    if (t < 32.0) { watM.setMatrixAt(i, HID); return; }
    const u = (p.ph + (t - 32.0) * 0.16) % 1;
    let x = 0.15 + p.x * (Lnow - 0.25), y, z = p.z;
    if (u < 0.3) y = lerp(yS, yC, u / 0.3);
    else if (u < 0.85 && t > 38.6) { y = yC; x = lerp(x, 0.0, (u - 0.3) / 0.55); }
    else if (t > 38.6) { y = r - ER; x = 0; z = lerp(p.z, LEN / 2 + 0.3, (u - 0.85) / 0.15); }
    else y = yC;
    _m.makeTranslation(x, y, z); watM.setMatrixAt(i, _m);
  });
  SD.forEach((p, i) => {
    if (t < 30.0) { saltM.setMatrixAt(i, HID); return; }
    const u = (p.ph + t * 0.14) % 1;
    _m.makeTranslation(0.1 + p.x * (Lnow - 0.15), yS + 0.004, lerp(-LEN / 2, LEN / 2 + (t > 44.3 ? 0.45 : 0), u)); saltM.setMatrixAt(i, _m);
  });
  [feedM, watM, saltM].forEach((m) => (m.instanceMatrix.needsUpdate = true));
  render();
  perbarui(t);
};
window._ready();
</script></body></html>
