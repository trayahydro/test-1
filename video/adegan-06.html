<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Adegan 6: Ultrafiltrasi</title>
<link rel="stylesheet" href="lib/overlay.css">
</head>
<body><div id="stage"></div>
<script>window.ready = new Promise((r) => (window._ready = r));</script>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { buatDunia, kamera, layar, latarStudio } from './lib/dunia.js';
import { siapkanAdegan, chip, bug, kartu, penanda, el, perbarui, waktu } from './lib/overlay.js';
import { prog, easeOut, easeInOut, lerp, clamp } from './lib/common.js';
import { rng } from './lib/tekstur.js';

const A = await siapkanAdegan(6);
const D = A.durasi;
const { scene, cam, pmrem, render } = buatDunia({ ao: false, bloom: 0.12, exposure: 0.92 });
latarStudio(scene, pmrem);
scene.add(new THREE.HemisphereLight('#dcecff', '#223344', 0.55));
const key = new THREE.DirectionalLight('#ffffff', 1.9); key.position.set(3, 5, 6); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -2, near: 1, far: 20 }); scene.add(key);
const keyB = new THREE.DirectionalLight('#ffffff', 2.0); keyB.position.set(103, 5, 6); keyB.target.position.set(100, 0, 0); scene.add(keyB, keyB.target);
const rim = new THREE.DirectionalLight('#6ec3ff', 1.5); rim.position.set(-4, 3, -3); scene.add(rim);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const R = rng(61);
const add = (geo, mat, x = 0, y = 0, z = 0, parent = scene) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };

// ---------- Panggung A: modul UF ----------
const white = new THREE.MeshPhysicalMaterial({ color: '#d4dae0', roughness: 0.45, clearcoat: 0.4 });
const whiteIn = new THREE.MeshStandardMaterial({ color: '#cfd8e0', roughness: 0.6, side: THREE.BackSide });
const cap = new THREE.MeshStandardMaterial({ color: '#1f4f94', roughness: 0.4 });
const frame = new THREE.MeshStandardMaterial({ color: '#474d55', roughness: 0.55, metalness: 0.3 });
const fiberM = new THREE.MeshStandardMaterial({ color: '#e2ddd0', roughness: 0.75 });
const mods = [];
[-0.32, 0.32].forEach((x, k) => {
  const g = new THREE.Group(); g.position.set(x, 0, 0); scene.add(g);
  const full = add(new THREE.CylinderGeometry(0.2, 0.2, 1.6, 48), white, 0, 0.9, 0, g);
  const half = add(new THREE.CylinderGeometry(0.2, 0.2, 1.6, 48, 1, true, Math.PI / 2, Math.PI), white, 0, 0.9, 0, g);
  add(new THREE.CylinderGeometry(0.195, 0.195, 1.6, 48, 1, true, Math.PI / 2, Math.PI), whiteIn, 0, 0.9, 0, g);
  [0.06, 1.74].forEach((y) => add(new THREE.CylinderGeometry(0.23, 0.23, 0.12, 48), cap, 0, y, 0, g));
  [0.3, 1.5].forEach((y) => { const p = add(new THREE.CylinderGeometry(0.05, 0.05, 0.16, 20), cap, 0.2 * (k ? 1 : -1) * 1.1, y, 0, g); p.rotation.z = Math.PI / 2; });
  // berkas serat berongga (hanya terlihat saat dipotong)
  const n = 700, fib = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.0055, 0.0055, 1.56, 6), fiberM, n);
  const m4 = new THREE.Matrix4();
  for (let i = 0; i < n; i++) { const a = R() * Math.PI * 2, r = Math.sqrt(R()) * 0.185; m4.makeTranslation(Math.cos(a) * r, 0.9, -Math.abs(Math.sin(a) * r)); fib.setMatrixAt(i, m4); }
  g.add(fib);
  mods.push({ full, half, fib });
});
add(new THREE.BoxGeometry(1.1, 0.04, 0.4), frame, 0, -0.02, 0);
[-0.5, 0.5].forEach((x) => add(new THREE.BoxGeometry(0.04, 1.9, 0.04), frame, x, 0.93, -0.25));
add(new THREE.BoxGeometry(1.04, 0.04, 0.04), frame, 0, 1.86, -0.25);

// ---------- Panggung B: satu serat (makro), dipotong untuk memperlihatkan lumen ----------
const B = new THREE.Group(); B.position.set(100, 0, 0); scene.add(B);
const pore = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); g.fillStyle = '#e9e4d8'; g.fillRect(0, 0, 256, 256); for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(90,80,70,${0.25 + R() * 0.4})`; g.beginPath(); g.arc(R() * 256, R() * 256, 0.8 + R() * 2.2, 0, 7); g.fill(); } const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 2); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const wallM = new THREE.MeshStandardMaterial({ map: pore, roughness: 0.85, side: THREE.DoubleSide });
const RO_ = 0.55, RI = 0.34, LEN = 7;
const outer = add(new THREE.CylinderGeometry(RO_, RO_, LEN, 64, 1, true, Math.PI / 2, Math.PI), wallM, 0, 0, 0, B); outer.rotation.z = Math.PI / 2;
const innr = add(new THREE.CylinderGeometry(RI, RI, LEN, 64, 1, true, Math.PI / 2, Math.PI), new THREE.MeshStandardMaterial({ map: pore, roughness: 0.8, side: THREE.DoubleSide, color: '#d8d2c4' }), 0, 0, 0, B); innr.rotation.z = Math.PI / 2;
[1, -1].forEach((s) => add(new THREE.BoxGeometry(LEN, RO_ - RI, 0.01), new THREE.MeshStandardMaterial({ map: pore, roughness: 0.9, color: '#cfc7b6' }), 0, s * (RI + RO_) / 2, 0, B));
const lumen = add(new THREE.CylinderGeometry(RI - 0.01, RI - 0.01, LEN, 48, 1, false, Math.PI / 2, Math.PI), new THREE.MeshPhysicalMaterial({ color: '#6fc8ff', transparent: true, opacity: 0.32, roughness: 0.05, depthWrite: false }), 0, 0, 0, B); lumen.rotation.z = Math.PI / 2;
// partikel: air (lolos ke lumen), bakteri, virus, koloid (tertahan di luar)
const water = new THREE.InstancedMesh(new THREE.SphereGeometry(0.03, 10, 8), new THREE.MeshBasicMaterial({ color: '#7fd4ff', toneMapped: false }), 220); B.add(water);
const WD = Array.from({ length: 220 }, () => ({ x: (R() * 2 - 1) * 3, th: (R() < 0.5 ? 1 : -1) * (0.35 + R() * 0.9), ph: R(), sp: 0.7 + R() * 0.5 }));
const bact = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.06, 0.2, 6, 12), new THREE.MeshStandardMaterial({ color: '#5fbf5a', roughness: 0.5 }), 26); B.add(bact);
const vir = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.045, 1), new THREE.MeshStandardMaterial({ color: '#b26ad8', roughness: 0.4, flatShading: true }), 40); B.add(vir);
const col = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.035, 0), new THREE.MeshStandardMaterial({ color: '#8a6a45', roughness: 0.9 }), 40); B.add(col);
const PD = (n) => Array.from({ length: n }, () => ({ x: (R() * 2 - 1) * 3.2, th: (R() < 0.5 ? 1 : -1) * (0.3 + R() * 1.1), ph: R(), sp: 0.4 + R() * 0.4, rot: R() * 6 }));
const BD = PD(26), VD = PD(40), CD = PD(40);
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(1, 1, 1), _p = new THREE.Vector3();
function partikel(t) {
  WD.forEach((w, i) => {
    const u = (w.ph + t * 0.12 * w.sp) % 1;
    let x = w.x, r;
    if (u < 0.55) r = lerp(1.7, RI * 0.6, easeInOut(u / 0.55)); else { r = RI * 0.6 * (1 - (u - 0.55)); x = w.x + (u - 0.55) * 6; }
    if (x > 3.4) x -= 6.8;
    _p.set(x, Math.sin(w.th) * r, -Math.abs(Math.cos(w.th)) * r * 0.5);
    _m.makeTranslation(_p.x, _p.y, _p.z); water.setMatrixAt(i, _m);
  });
  water.instanceMatrix.needsUpdate = true;
  [[bact, BD, 0.18], [vir, VD, 0.06], [col, CD, 0.05]].forEach(([mesh, data, sz]) => {
    data.forEach((d, i) => {
      const w = (d.ph + t * 0.18 * d.sp) % 1, tri = w < 0.5 ? w * 2 : 2 - w * 2;
      const r = lerp(1.8, RO_ + sz + 0.02, tri);
      _p.set(d.x + Math.sin(t * 0.5 + d.rot) * 0.1, Math.sin(d.th) * r, -Math.abs(Math.cos(d.th)) * r * 0.6);
      _e.set(d.rot + t * 0.4, d.rot, d.rot * 0.5); _q.setFromEuler(_e); _m.compose(_p, _q, _s); mesh.setMatrixAt(i, _m);
    });
    mesh.instanceMatrix.needsUpdate = true;
  });
}

const camAt = kamera(cam, [
  { t: 0, p: [1.6, 1.4, 4.4], l: [0, 0.9, 0], f: 36 },
  { t: 8.6, p: [0.95, 1.3, 2.5], l: [0.3, 1.0, -0.05], f: 34 },
  { t: 9.3, p: [101.9, 1.7, 4.6], l: [100, 0, -0.15], f: 38 },
  { t: 21.9, p: [100.9, 1.5, 3.9], l: [99.9, 0, -0.15], f: 38 },
  { t: 22.6, p: [1.9, 1.3, 4.6], l: [0, 0.9, 0], f: 36 },
  { t: D, p: [1.4, 1.2, 4.2], l: [0, 0.9, 0], f: 36 },
]);
const flash = el('', 'shade'); flash.style.background = '#06152c';

chip('2', 'Ultrafiltrasi (Opsional)', 'Membran serat berongga', 2, 0.3);
bug(0.2);
const S = (p) => (t) => { const s = layar(cam, p); return s[2] < 1 ? s : null; };
kartu({ k: 'OPSI PRETREATMENT', tt: 'Modul Ultrafiltrasi', rows: [['Untuk', 'air baku keruh'], ['Fungsi', 'melengkapi / mengganti MMF']], x: 1360, y: 210, t0: 3.6, t1: 9.0, anchor: S(V(0.32, 1.3, 0.21)) });
penanda('•', 'Ribuan serat berongga', S(V(0.32, 0.7, -0.05)), 6.8, 9.0, { kiri: true });
penanda('•', 'Dinding serat berpori', S(V(100.8, RO_ * 0.8, 0)), 10.4, 21.6);
penanda('•', 'Lumen: air bersih', S(V(98.4, 0.0, -0.1)), 11.4, 21.6, { kiri: true });
kartu({ k: 'UKURAN PORI', tt: '0,01–0,03 µm', rows: [['Status', 'tipikal'], ['Bakteri', '± 1 µm → tertahan'], ['Virus', '± 0,02–0,3 µm → sebagian besar tertahan']], x: 110, y: 200, t0: 12.0, t1: 21.6, w: 500 });
penanda('•', 'Bakteri', S(V(101.6, 1.25, -0.2)), 16.0, 21.6);
penanda('•', 'Virus', S(V(98.6, 1.15, -0.2)), 17.2, 21.6, { kiri: true });
penanda('•', 'Koloid', S(V(99.6, -1.25, -0.2)), 18.4, 21.6, { kiri: true });
kartu({ k: 'HASIL', tt: 'Air Umpan Stabil', rows: [['SDI', '< 3', 'TIPIKAL'], ['Manfaat', 'beban membran RO lebih ringan']], x: 1360, y: 210, t0: 22.8, t1: 99 });

window.renderFrame = (tl) => {
  const t = waktu(tl);
  camAt(t);
  const cut = easeInOut(prog(t, 5.2, 1.4));
  mods.forEach((m) => { m.full.visible = cut < 0.5; m.half.visible = cut >= 0.5; m.fib.visible = cut >= 0.5; });
  partikel(t);
  render();
  flash.style.opacity = Math.max(Math.sin(clamp((t - 8.85) / 0.9) * Math.PI), Math.sin(clamp((t - 21.75) / 0.9) * Math.PI));
  perbarui(t);
};
window._ready();
</script></body></html>
