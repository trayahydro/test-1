<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Adegan 4b: Pompa umpan & strainer</title>
<link rel="stylesheet" href="lib/overlay.css">
</head>
<body><div id="stage"></div>
<script>window.ready = new Promise((r) => (window._ready = r));</script>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { kamera, layar } from './lib/dunia.js';
import { panggungKontainer } from './lib/panggung.js';
import { aliranPipa, rangkaian, WARNA } from './lib/aliran.js';
import { siapkanAdegan, chip, bug, kartu, perbarui, waktu } from './lib/overlay.js';
import { prog, easeOut, easeInOut, lerp } from './lib/common.js';
import { rng } from './lib/tekstur.js';

const T0 = 14.0;
const A = await siapkanAdegan(4, { dari: T0 });
const P = await panggungKontainer();
const { scene, cam, refs, M } = P;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const yg = -0.26, SX = -1.75, SZ = -0.6;

// strainer dibuat bisa "transparan" untuk memperlihatkan keranjang di dalamnya
const body = refs.strainerBody; body.material = body.material.clone(); body.material.transparent = true;
const lid = refs.strainerLid; const lidY = lid.position.y;
const holes = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 128, 128); g.fillStyle = '#000'; for (let y = 4; y < 128; y += 12) for (let x = (y / 12) % 2 ? 4 : 10; x < 128; x += 12) { g.beginPath(); g.arc(x, y, 3.6, 0, 7); g.fill(); } const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 4); return t; })();
const basket = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.1, 0.44, 40, 1, true), new THREE.MeshStandardMaterial({ color: '#d7dde2', metalness: 0.8, roughness: 0.35, alphaMap: holes, alphaTest: 0.5, side: THREE.DoubleSide }));
basket.position.set(SX, yg + 0.36, SZ); scene.add(basket);
const R = rng(4), debris = [];
const dcol = ['#3f7a3a', '#2f6a2e', '#e8e3d6', '#6b4f33', '#5aa0d8'];
for (let i = 0; i < 22; i++) {
  const geo = i % 3 === 0 ? new THREE.BoxGeometry(0.012, 0.09, 0.03) : i % 3 === 1 ? new THREE.IcosahedronGeometry(0.014, 0) : new THREE.BoxGeometry(0.03, 0.004, 0.025);
  const d = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: dcol[i % dcol.length], roughness: 0.8 }));
  const a = R() * Math.PI * 2, r = R() * 0.08;
  d.position.set(SX + Math.cos(a) * r, yg + 0.17 + R() * 0.12, SZ + Math.sin(a) * r); d.rotation.set(R() * 3, R() * 3, R() * 3);
  scene.add(d); debris.push(d);
}
const water = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.125, 0.48, 40), new THREE.MeshStandardMaterial({ color: '#2f86d0', transparent: true, opacity: 0, roughness: 0.1 }));
water.position.set(SX, yg + 0.36, SZ); scene.add(water);

const F = (n, w, o = {}) => aliranPipa(refs, n, w, { parent: scene, ...o });
const masuk = rangkaian([F('intake', WARNA.laut), F('feedOut', WARNA.laut), F('feed', WARNA.laut)]);

const camAt = kamera(cam, [
  { t: 14.0, p: [-4.6, 1.3, -3.8], l: [-1.3, 0.35, -0.4], f: 40 },
  { t: 18.2, p: [-3.3, 0.95, -2.6], l: [-1.45, 0.25, -0.6], f: 38 },
  { t: 23.8, p: [-2.55, 0.72, -1.75], l: [-1.75, 0.3, -0.6], f: 34 },
  { t: A.durasi, p: [-5.2, 2.5, -4.8], l: [-1.0, 1.5, 0.0], f: 40 },
]);

chip('1', 'Intake Air Laut', 'Pompa umpan & strainer', 0, T0 + 0.2);
bug(T0);
const S = (p) => (t) => { const s = layar(cam, p); return s[2] < 1 ? s : null; };
kartu({ k: 'POMPA UMPAN', tt: 'Feed Pump', rows: [['Fungsi', 'mengalirkan air laut'], ['Tujuan', 'menuju kontainer SWRO'], ['Material', 'tahan korosi air laut']], x: 1340, y: 190, t0: 14.6, t1: 18.2, anchor: S(V(-0.9, 0.08, -0.6)) });
kartu({ k: 'PELINDUNG AWAL', tt: 'Basket Strainer', rows: [['Menahan', 'sampah & rumput laut'], ['Ukuran', 'partikel kasar (milimeter)'], ['Perawatan', 'keranjang dibersihkan berkala']], x: 1340, y: 190, t0: 18.8, t1: 26.0, anchor: S(V(SX, yg + 0.45, SZ)) });

window.renderFrame = (tl) => {
  const t = waktu(tl);
  camAt(t);
  P.sea.update(t);
  masuk.set(t, 0.25 + 0.75 * easeInOut(prog(t, 14.2, 3.6)), 1);
  // potongan strainer: badan memudar, tutup terangkat, air & keranjang terlihat
  const k = easeInOut(prog(t, 18.6, 1.4)) * (1 - easeInOut(prog(t, 26.2, 1.2)));
  body.material.opacity = 1 - 0.82 * k; body.material.depthWrite = k < 0.5;
  lid.position.y = lidY + 0.28 * k;
  basket.visible = k > 0.01; debris.forEach((d, i) => { d.visible = k > 0.01; d.position.y += Math.sin(t * 3 + i) * 0.0004; });
  water.material.opacity = 0.18 * k; water.visible = k > 0.01;
  P.render();
  perbarui(t);
};
window._ready();
</script></body></html>
