<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Adegan 9a: HPP di kontainer</title>
<link rel="stylesheet" href="lib/overlay.css">
</head>
<body><div id="stage"></div>
<script>window.ready = new Promise((r) => (window._ready = r));</script>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { kamera, layar } from './lib/dunia.js';
import { panggungKontainer } from './lib/panggung.js';
import { aliranPipa, WARNA } from './lib/aliran.js';
import { siapkanAdegan, chip, bug, perbarui, waktu } from './lib/overlay.js';
import { dial } from './lib/dial.js';
import { prog, easeOut, easeInOut } from './lib/common.js';

const POTONG = 12.3;
const A = await siapkanAdegan(9, { ke: POTONG });
const P = await panggungKontainer();
const { scene, cam, refs } = P;
P.setEnv(true);
P.setDinding(1);
const fLp = aliranPipa(refs, 'lp', WARNA.pre, { parent: scene });
const fHp = aliranPipa(refs, 'hp', WARNA.hp, { parent: scene, speed: 1.6 });
const camAt = kamera(cam, [
  { t: 0, p: [9.0, 1.65, -2.75], l: [9.3, 0.55, 0.2], f: 46 },
  { t: 6.0, p: [9.6, 1.35, -2.3], l: [9.5, 0.55, 0.2], f: 44 },
  { t: POTONG, p: [9.5, 1.05, -1.75], l: [9.3, 0.45, 0.15], f: 42 },
]);
chip('5', 'Pompa Tekanan Tinggi', 'High pressure pump (HPP)', 5, 0.3);
bug(0.2);
const g = dial({ x: 110, y: 200, osmotik: true });
window.renderFrame = (tl) => {
  const t = waktu(tl);
  camAt(t); P.sea.update(t);
  const spin = t > 0.5 ? 30 * ((t - 0.5) - (1 - Math.exp(-1.2 * (t - 0.5))) / 1.2) : 0;
  refs.hppKopling.rotation.x = spin;
  const p = 2.5 + 59.5 * easeInOut(prog(t, 3.2, 5.8));
  fLp.set(t, 1, 1); fHp.set(t, 1, 0.35 + 0.65 * (p / 62));
  P.render();
  g.set(p, easeOut(prog(t, 2.6, 0.6)));
  perbarui(t);
};
window._ready();
</script></body></html>
