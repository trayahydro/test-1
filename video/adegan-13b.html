<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Adegan 13b: Pembuangan brine</title>
<link rel="stylesheet" href="lib/overlay.css">
</head>
<body><div id="stage"></div>
<script>window.ready = new Promise((r) => (window._ready = r));</script>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { buatDunia, kamera, layar, latarStudio, loadImg } from './lib/dunia.js';
import { buatDiorama, kelapa, h, DZ, SEA } from './lib/diorama.js';
import { makeMaterials, buildSWRO } from './lib/model.js';
import { aliran, WARNA } from './lib/aliran.js';
import { siapkanAdegan, chip, bug, kartu, penanda, perbarui, waktu } from './lib/overlay.js';
import { prog, easeOut, easeInOut, lerp } from './lib/common.js';
import { rng } from './lib/tekstur.js';

const T0 = 13.1;
const A = await siapkanAdegan(13, { dari: T0 });
const { scene, cam, pmrem, render } = buatDunia({ ao: false, bloom: 0.12, exposure: 1.0 });
latarStudio(scene, pmrem);
scene.add(new THREE.HemisphereLight('#e6f2ff', '#3a4a5a', 0.7));
const sun = new THREE.DirectionalLight('#fff4e0', 2.6); sun.position.set(-6, 14, 9); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 9, bottom: -9, near: 1, far: 50 }); scene.add(sun);
const dio = buatDiorama(scene, { mode: 'lapisan' });
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const FZ = DZ / 2;
[[-1.6, -1.0], [-0.8, -2.2], [-2.6, -2.4]].forEach(([x, z], i) => kelapa(dio.G, x, z, 1.3 + (i % 3) * 0.25, i + 7));
const logos = { dark: await loadImg('../logo/traya-logo-putih.png'), light: await loadImg('../traya-logo.png') };
await document.fonts.ready;
const M = makeMaterials(logos);
const { root: cont, refs } = buildSWRO(M, logos);
refs.pad.visible = false;
const SC = 0.25, CX = -6.37, CZ = 0.6, CY = 0.16 * SC;
cont.scale.setScalar(SC); cont.rotation.y = Math.PI; cont.position.set(CX, CY, CZ); scene.add(cont);

// pipa outfall brine: dari kontainer → di bawah pantai & dasar laut → difuser
const XD0 = 5.0, XD1 = 7.6;
const pts = [V(-6.1, -0.05, 0.3), V(-6.1, -0.35, 0.3), V(-6.1, -0.35, FZ), V(-0.6, -0.35, FZ)];
for (let x = 0.0; x <= XD1; x += 0.6) pts.push(V(x, h(x) - 0.3, FZ));
const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.3);
const pipe = new THREE.Mesh(new THREE.TubeGeometry(curve, 300, 0.07, 14), new THREE.MeshStandardMaterial({ color: '#25292e', roughness: 0.45 })); scene.add(pipe);
const fB = aliran(curve, 0.07, WARNA.brine, { parent: scene, speed: 1.0, spacing: 0.4, scale: 1.35 });
// riser difuser dengan nosel
const risers = [];
for (let i = 0; i < 4; i++) {
  const x = XD0 + i * (XD1 - XD0) / 3, y0 = h(x) - 0.3;
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.6, 12), new THREE.MeshStandardMaterial({ color: '#30363d' })); r.position.set(x, y0 + 0.3, FZ); scene.add(r);
  const n = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 10), new THREE.MeshStandardMaterial({ color: '#ff8a3d', roughness: 0.5 })); n.position.set(x, y0 + 0.62, FZ); scene.add(n);
  risers.push(V(x, y0 + 0.65, FZ));
}
// plume: partikel oranye menyembur lalu bercampur (memudar ke biru)
const R = rng(13), N = 260;
const pl = new THREE.InstancedMesh(new THREE.SphereGeometry(0.03, 8, 6), new THREE.MeshBasicMaterial({ transparent: true, toneMapped: false }), N); pl.frustumCulled = false; scene.add(pl);
const PD = Array.from({ length: N }, (_, i) => ({ r: i % 4, ph: R(), a: (R() - 0.5) * 1.4, sp: 0.7 + R() * 0.6, dz: (R() - 0.5) * 0.4 }));
const cO = new THREE.Color(WARNA.brine), cW = new THREE.Color('#2f86d0'), _c = new THREE.Color(), _m = new THREE.Matrix4();

const camAt = kamera(cam, [
  { t: 13.1, p: [-1.5, 6.6, 16.8], l: [-0.6, -1.2, 0], f: 42 },
  { t: 16.8, p: [2.6, 2.4, 13.0], l: [3.0, -1.8, 2.0], f: 40 },
  { t: 19.6, p: [6.6, 0.4, 9.2], l: [6.2, -2.6, 2.6], f: 40 },
  { t: A.durasi, p: [6.0, 0.6, 9.8], l: [6.2, -2.4, 2.4], f: 40 },
]);
chip('9', 'Pembuangan Brine', 'Outfall & difuser', 9, T0 + 0.2);
bug(T0);
const S = (p) => (t) => { const s = layar(cam, p); return s[2] < 1 ? s : null; };
kartu({ k: 'KONSENTRAT', tt: 'Brine', rows: [['Kadar garam', '± 2× air laut', 'TIPIKAL'], ['Dialirkan', 'lewat pipa outfall']], x: 1360, y: 200, t0: 13.5, t1: 19.5, anchor: S(V(2.5, h(2.5) - 0.3, FZ)) });
kartu({ k: 'DIFUSER', tt: 'Pencampuran Cepat', rows: [['Desain', 'nosel menyebar ke atas'], ['Tujuan', 'dampak lingkungan minimal'], ['Mengikuti', 'ketentuan yang berlaku']], x: 1360, y: 200, t0: 19.8, t1: 99, anchor: S(risers[1]) });

window.renderFrame = (tl) => {
  const t = waktu(tl);
  camAt(t); dio.update(t);
  fB.set(t, easeInOut(prog(t, 13.4, 4.0)), 1);
  PD.forEach((p, i) => {
    const o = risers[p.r];
    const u = (p.ph + t * 0.22 * p.sp) % 1;
    const x = o.x + Math.sin(p.a) * u * 0.9, y = o.y + u * 1.2 - u * u * 0.4, z = o.z + p.dz * u;
    _m.makeScale(1 + u * 1.5, 1 + u * 1.5, 1 + u * 1.5); _m.setPosition(x, Math.min(y, SEA - 0.05), z);
    pl.setMatrixAt(i, t > 18.8 ? _m : new THREE.Matrix4().makeScale(0, 0, 0)); _c.copy(cO).lerp(cW, Math.min(1, u * 1.3)); pl.setColorAt(i, _c);
  });
  pl.instanceMatrix.needsUpdate = true; pl.instanceColor.needsUpdate = true;
  render(); perbarui(t);
};
window._ready();
</script></body></html>
